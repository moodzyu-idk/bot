<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiniMario - Pixel Rabbit</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            background-color: #222;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none;
            user-select: none;
        }

        /* Wadah Canvas biar proporsional */
        .canvas-container { 
            position: relative; 
            width: 100%; 
            max-width: 600px;
            display: flex; 
            justify-content: center;
            padding: 5px;
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #fecfef 100%);
            border: 4px solid #333; border-radius: 8px;
            width: 100%; 
            height: auto;
            aspect-ratio: 2 / 1; /* Skala 2:1 biar nggak gepeng */
            image-rendering: pixelated; 
            display: block;
        }

        /* Panel Kontrol */
        #controls {
            width: 100%; max-width: 600px;
            display: flex; justify-content: space-between;
            padding: 0 15px; 
            margin-top: 15px; z-index: 10;
        }
        .dpad { display: flex; gap: 10px; }
        
        .btn {
            background-color: #444; color: white;
            border: 3px solid #111; border-radius: 12px;
            width: 60px; height: 60px; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 #111; cursor: pointer;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 0 0 #111; }
        #btnJump { 
            background-color: #e74c3c; 
            width: 100px; 
            font-size: 16px; 
            font-weight: bold; 
        }

        /* Tombol Restart */
        #btnRestart {
            display: none; position: absolute; top: 50%;
            left: 50%; transform: translate(-50%, -50%);
            background-color: #f1c40f; color: #000;
            border: 3px solid #333; border-radius: 10px;
            padding: 10px 20px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 0 #999; cursor: pointer; z-index: 20;
        }
        #btnRestart:active { transform: translate(-50%, -45%); box-shadow: 0 0 0 #999; }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="300"></canvas>
        <button id="btnRestart">🔄 MAIN LAGI</button>
    </div>

    <div id="controls">
        <div class="dpad">
            <div class="btn" id="btnLeft">⬅️</div>
            <div class="btn" id="btnRight">➡️</div>
        </div>
        <div class="btn" id="btnJump">LOMPAT</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Fisika & Konstanta
        const GRAVITY = 0.5;
        const JUMP_POWER = -10.5;
        const BASE_SPEED = 3;
        const GROUND_Y = 260;
        
        let score = 0, hp = 3, gameOver = false, cameraX = 0, frames = 0;

        const player = {
            x: 150, y: 150, w: 24, h: 28,
            vx: 0, vy: 0, grounded: false, invulnerable: 0
        };

        let platforms = [], enemies = [], coins = [];
        const keys = { left: false, right: false, jump: false };

        function bindBtn(id, keyName) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener("touchstart", start);
            btn.addEventListener("touchend", end);
            btn.addEventListener("mousedown", start);
            btn.addEventListener("mouseup", end);
            btn.addEventListener("mouseleave", end);
        }
        bindBtn("btnLeft", "left"); bindBtn("btnRight", "right"); bindBtn("btnJump", "jump");

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowRight") keys.right = true;
            if (e.key === "ArrowLeft") keys.left = true;
            if (e.key === "ArrowUp" || e.key === " ") keys.jump = true;
        });
        window.addEventListener("keyup", e => {
            if (e.key === "ArrowRight") keys.right = false;
            if (e.key === "ArrowLeft") keys.left = false;
            if (e.key === "ArrowUp" || e.key === " ") keys.jump = false;
        });

        function resetGame() {
            score = 0; hp = 3; gameOver = false; cameraX = 0; frames = 0;
            player.x = 100; player.y = GROUND_Y - player.h - 10; player.vx = 0; player.vy = 0; player.invulnerable = 0;
            
            document.getElementById("btnRestart").style.display = "none";
            
            platforms = [{ x: -100, y: GROUND_Y, w: 600, h: 40, type: 'ground' }];
            enemies = [];
            coins = [];
            update();
        }

        // --- MESIN PEMBUAT MAP (LEVEL GENERATOR) ---
        function spawnMap() {
            let lastP = platforms[platforms.length - 1];
            
            while (lastP.x + lastP.w < cameraX + canvas.width + 600) {
                let gap = Math.random() * 60 + 50; 
                let nextX = lastP.x + lastP.w + gap;
                let pWidth = Math.random() * 200 + 200; 

                platforms.push({ x: nextX, y: GROUND_Y, w: pWidth, h: 40, type: 'ground' });

                if (Math.random() < 0.7) {
                    let numBricks = Math.floor(Math.random() * 3) + 1; 
                    let brickX = nextX + 50;
                    for (let i = 0; i < numBricks; i++) {
                        platforms.push({ x: brickX + (i * 40), y: GROUND_Y - 100, w: 40, h: 15, type: 'brick' });
                        if (Math.random() < 0.5) coins.push({ x: brickX + (i * 40) + 15, y: GROUND_Y - 140, r: 8, taken: false });
                    }
                }

                if (Math.random() < 0.7) {
                    enemies.push({ 
                        x: nextX + 50, 
                        y: GROUND_Y - 24, 
                        w: 24, h: 24, 
                        vx: -1, 
                        dead: false 
                    });
                }

                if (Math.random() < 0.5) {
                    coins.push({ x: nextX + pWidth - 50, y: GROUND_Y - 30, r: 8, taken: false });
                }

                lastP = platforms[platforms.length - 1];
            }
        }

        function update() {
            if (gameOver) return;
            requestAnimationFrame(update);

            frames++;
            if (player.invulnerable > 0) player.invulnerable--;

            player.vx = 0;
            if (keys.left) player.vx = -BASE_SPEED;
            if (keys.right) player.vx = BASE_SPEED;
            player.vy += GRAVITY;
            
            player.x += player.vx;
            for (let p of platforms) {
                if (checkCollide(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.w;
                    if (player.vx < 0) player.x = p.x + p.w;
                }
            }

            player.y += player.vy;
            player.grounded = false;
            for (let p of platforms) {
                if (checkCollide(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            if (keys.jump && player.grounded) {
                player.vy = JUMP_POWER;
                keys.jump = false;
            }

            if (player.x > canvas.width / 3) cameraX = player.x - canvas.width / 3;
            if (player.x < 50) player.x = 50; 

            if (player.y > canvas.height + 50) takeDamage(true);

            enemies.forEach(e => {
                if (e.dead) return;
                
                let nextX = e.vx > 0 ? e.x + e.w + 5 : e.x - 5;
                let hasGroundAhead = false;
                
                for (let p of platforms) {
                    if (nextX > p.x && nextX < p.x + p.w && e.y + e.h >= p.y && e.y + e.h <= p.y + 10) {
                        hasGroundAhead = true; break;
                    }
                }

                if (!hasGroundAhead) e.vx *= -1;
                e.x += e.vx;

                if (checkCollide(player, e) && player.invulnerable <= 0) {
                    if (player.vy > 0 && player.y + player.h < e.y + 15) {
                        e.dead = true;
                        player.vy = -8;
                        score += 10;
                    } else {
                        takeDamage();
                    }
                }
            });

            coins.forEach(c => {
                if (!c.taken && checkCollide(player, {x: c.x, y: c.y, w: c.r*2, h: c.r*2})) {
                    c.taken = true; score += 5;
                }
            });

            spawnMap();
            platforms = platforms.filter(p => p.x + p.w > cameraX - 200);
            enemies = enemies.filter(e => e.x > cameraX - 200);
            coins = coins.filter(c => c.x > cameraX - 200 && !c.taken);

            draw();
        }

        function checkCollide(r1, r2) {
            return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                    r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
        }

        function takeDamage(fall = false) {
            if (player.invulnerable > 0 || gameOver) return;
            hp--;
            player.invulnerable = 90;

            if (hp <= 0) {
                gameOver = true;
                document.getElementById("btnRestart").style.display = "block";
                draw();
                return;
            }

            if (fall) {
                player.x = cameraX + 50; 
                player.y = 0; player.vy = 0;
            } else {
                player.vy = -5; player.vx = -5; 
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0); 

            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = "#8b4513"; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "#228b22"; ctx.fillRect(p.x, p.y, p.w, 8);
                    ctx.fillStyle = "#5c2e0b";
                    for(let i=0; i<p.w; i+=20) ctx.fillRect(p.x+i, p.y+15, 10, 10);
                } else {
                    ctx.fillStyle = "#cd853f"; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(p.x, p.y + p.h/2, p.w, 2);
                }
            });

            coins.forEach(c => {
                if (!c.taken) {
                    ctx.fillStyle = "#ffd700"; ctx.beginPath();
                    ctx.arc(c.x + c.r, c.y + c.r, c.r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = "#b8860b"; ctx.lineWidth = 2; ctx.stroke();
                }
            });

            enemies.forEach(e => {
                if (!e.dead) {
                    ctx.fillStyle = "#d35400"; 
                    ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, Math.PI, 0); ctx.fill(); 
                    ctx.fillRect(e.x, e.y + e.h/2, e.w, e.h/2); 
                    ctx.fillStyle = "#f5deb3"; 
                    ctx.fillRect(e.x + 4, e.y + e.h/2 + 2, 16, 10); 
                    ctx.fillStyle = "#000";
                    ctx.fillRect(e.x + 6, e.y + 10, 4, 6); ctx.fillRect(e.x + 14, e.y + 10, 4, 6);
                }
            });

            if (player.invulnerable % 10 < 5 || player.invulnerable === 0) {
                ctx.fillStyle = "#ffffff"; ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillRect(player.x + 4, player.y - 10, 6, 10);
                ctx.fillRect(player.x + 14, player.y - 10, 6, 10);
                ctx.fillStyle = "#000000";
                ctx.fillRect(player.x + 6, player.y + 8, 4, 4);
                ctx.fillRect(player.x + 14, player.y + 8, 4, 4);
                ctx.fillStyle = "#ffb6c1";
                ctx.fillRect(player.x + 4, player.y + 14, 4, 2);
                ctx.fillRect(player.x + 16, player.y + 14, 4, 2);
            }
            ctx.restore();

            ctx.fillStyle = "#fff"; ctx.font = "bold 20px 'Courier New'";
            ctx.fillText("SKOR: " + score, 20, 30);
            for (let i = 0; i < hp; i++) {
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(canvas.width - 40 - (i * 30), 15, 20, 20);
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                ctx.font = "bold 40px 'Courier New'"; ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 20);
                ctx.font = "20px 'Courier New'"; ctx.fillText("Skor Akhir: " + score, canvas.width/2, canvas.height/2 + 20);
                ctx.textAlign = "left";
            }
        }

        document.getElementById("btnRestart").addEventListener("click", resetGame);
        resetGame();
    </script>
</body>
</html>
